name: lifetrail
description: "Life Trail Mobile — original 2D landscape life-simulation game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.22.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/home.png
    - assets/images/atm.png
    - assets/images/tree.png
    - assets/images/grass_tile.png
    - assets/images/plaza.jpg
    - assets/images/cafe.png
    - assets/images/church.png
    - assets/images/school.png
    - assets/images/repair.png
    - assets/images/bookstore.png
    - assets/images/supermarket.png
    - assets/images/pizzahut.png
    - assets/images/hospital.png
    - assets/images/restaurant.png
    - assets/images/laundry.png
    - assets/images/bank.png
    - assets/images/mall.png
    - assets/images/police.png
    - assets/images/computer.png
    - assets/images/amusement.png
    - assets/images/beach.png
    - assets/images/fishing.png
    - assets/images/hotel.png
    - assets/images/park.png
    - assets/data/npcs/
    - assets/data/quests/
    - assets/data/items/
    - assets/data/dialogue/
    - assets/data/locations/
    - assets/data/school/
